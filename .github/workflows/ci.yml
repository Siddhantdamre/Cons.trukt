name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts tests
      - run: python -m mypy src
      - run: python -m pytest -q
      - run: python -m cons_trukt train-hazard-model
      - run: python -m cons_trukt evaluate-hazards
      - run: python -m cons_trukt fit-precedent-index
      - run: python -m cons_trukt evaluate-retrieval
      - run: python scripts/build_v2_benchmarks.py
      - run: python -m cons_trukt train-hazard-model --dataset benchmarks/hazard_v2/train.jsonl --output artifacts/hazard_nb_v2.json
      - run: python -m cons_trukt validate-hazards --dataset benchmarks/hazard_v2/test.jsonl --ood-dataset benchmarks/hazard_v2/ood_v3.jsonl --model artifacts/hazard_nb_v2.json --output results/hazard_v2/selective_evaluation_v3.json
      - run: python -m cons_trukt fit-precedent-index --corpus benchmarks/retrieval_v2/corpus.jsonl --output artifacts/precedent_tfidf_v2.json
      - run: python -m cons_trukt evaluate-retrieval --queries benchmarks/retrieval_v2/queries.jsonl --model artifacts/precedent_tfidf_v2.json --output results/retrieval_v2/evaluation.json
